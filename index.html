<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Prueba Gráfica Fija</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background: #1a1a2e;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    canvas {
      max-width: 800px;
      max-height: 400px;
    }
  </style>
</head>
<body>
  <canvas id="testChart"></canvas>

  <script>
    const ctx = document.getElementById('testChart').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: ["10:00", "11:00", "12:00", "13:00", "14:00"],
        datasets: [{
          label: "Precio de prueba",
          data: [34.2, 34.5, 34.7, 34.6, 34.9],
          borderColor: 'rgb(75, 192, 192)',
          tension: 0.1
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: { beginAtZero: false }
        }
      }
    });
  </script>
</body>
</html>
